<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BB Picks Board</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1014" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BB Board">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="8" class="logo-bg"/><path d="M9 21.5 14 15l4 3.5 5.5-8" class="logo-line"/><circle cx="23.5" cy="10.5" r="2.2" class="logo-dot"/></svg><span class="brand-long">BB Picks Board</span><span class="brand-short">BB Board</span></div>
    <button type="button" id="fresh" class="fresh" data-fresh="1" aria-label="How fresh the data is">Loading…</button>
    <button type="button" class="icon-btn" data-search-open="1" aria-label="Find a team or match"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></button>
    <button type="button" class="icon-btn" data-theme-toggle="1" aria-label="Theme"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg></button>
  </div>
</header>
  <nav class="tabs" aria-label="Views">
    <button type="button" data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Today</span></button>
    <button type="button" data-tab="results"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M5 15l4-4 3 3 6-7"/></svg><span>Results</span></button>
    <button type="button" data-tab="trends"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17.5 9 12l3.5 3L20 7"/><path d="M14.5 7H20v5.5"/><path d="M4 20.5h16" opacity=".45"/></svg><span>Trends</span></button>
    <button type="button" data-tab="slices"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg><span>Slices</span></button>
    <button type="button" data-tab="model"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.8"/></svg><span>Model</span></button>
    <button type="button" data-tab="lines"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h18M7 7.5v9M12 5v14M17 8.5v7"/></svg><span>Lines</span></button>
    <button type="button" data-tab="money"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 15h2"/></svg><span>Money</span></button>
    <button type="button" data-tab="fun"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5a1.5 1.5 0 0 1 1.5-1.5h13A1.5 1.5 0 0 1 20 7.5v2a2.5 2.5 0 0 0 0 5v2a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 16.5v-2a2.5 2.5 0 0 0 0-5Z"/><path d="M14.5 6v12" stroke-dasharray="1.6 2"/></svg><span>Fun</span></button>
    <button type="button" data-tab="ideas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3Z"/></svg><span>Ideas</span></button>
  </nav>
<div id="filterbar" class="filterbar" hidden></div>
<main id="view" class="view" tabindex="-1"><p class="empty">Loading the board…</p></main>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop"></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <header class="sheet-head"><span class="sheet-grip" aria-hidden="true"></span><h2 class="sheet-title" id="sheet-title"></h2><button type="button" class="sheet-close" aria-label="Close">✕</button></header>
    <div class="sheet-body"></div>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<div id="lock" class="lock" hidden>
  <form class="lock-card" autocomplete="off">
    <svg class="logo logo-lg" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="8" class="logo-bg"/><path d="M9 21.5 14 15l4 3.5 5.5-8" class="logo-line"/><circle cx="23.5" cy="10.5" r="2.2" class="logo-dot"/></svg>
    <h1>BB Picks Board</h1>
    <p>This board is locked. Open it from the link in your BB Picks chat, or paste the link or its key here once; this phone keeps it.</p>
    <label for="lock-key">Link or key</label>
    <input id="lock-key" type="text" inputmode="url" spellcheck="false" autocapitalize="off" placeholder="https://… or the key">
    <p class="lock-error" role="alert"></p>
    <button type="submit" class="btn">Open the board</button>
  </form>
</div>

<script src="vendor/echarts.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
